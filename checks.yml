checks:
  - check: row_count
    min: 10000

  - check: not_null
    column: player_id

  - check: not_null
    column: receiving_yards

  - check: in_range
    column: receiving_yards
    min: -20
    max: 400

  - check: in_range
    column: week
    min: 1
    max: 22

  - check: accepted_values
    column: season
    values: [2018, 2019, 2020, 2021, 2022, 2023, 2024]

  - check: unique_composite
    columns: [player_id, season, week]
